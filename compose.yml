services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      # Least-privilege role from ops/db/least-privilege.sql (data access only). Until
      # APP_DB_USER/APP_DB_PASSWORD are set in .env, the bootstrap superuser is used.
      DATABASE_URL: postgresql+asyncpg://${APP_DB_USER:-${POSTGRES_USER}}:${APP_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
      TURN_URLS: ${TURN_URLS:-}
      TURN_SECRET_FILE: /run/messenger-secrets/turn-secret
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      GOOGLE_APPLICATION_CREDENTIALS: /run/messenger-secrets/firebase-service-account.json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

      REFRESH_TOKEN_SESSION_HOURS: ${REFRESH_TOKEN_SESSION_HOURS}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}

      REFRESH_TOKEN_REMEMBER_DAYS: ${REFRESH_TOKEN_REMEMBER_DAYS}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURITY: ${SMTP_SECURITY}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}

      EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS}
      PASSWORD_RESET_COOLDOWN_SECONDS: ${PASSWORD_RESET_COOLDOWN_SECONDS:-60}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      # Same-origin web app: leave empty in production. Dev example: http://localhost:5173
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}


    volumes:
      - ./backend:/app
      - avatar_data:/app/uploads
      - ./secrets:/run/messenger-secrets:ro

    # The backend is reachable only on the internal Docker network (no published port),
    # so it trusts the X-Forwarded-For that Caddy sets to the client address it computed.
    # --ws-max-size caps a single WebSocket frame (call SDP offers are at most 64 KB).
    # No --reload in production: after changing backend code, run
    # `docker compose restart backend`. Keep a single process: presence, calls and rate
    # limits live in memory.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--ws-max-size", "262144"]

    depends_on:
      db:
        condition: service_healthy

  # Schema migrations, with the migration role (owner of the schema). The long-running
  # backend never holds these credentials:  docker compose run --rm migrate
  migrate:
    # Same image as the backend (no rebuild, so no untested dependency versions).
    image: messenger-backend
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${MIGRATOR_DB_USER:-${POSTGRES_USER}}:${MIGRATOR_DB_PASSWORD:-${POSTGRES_PASSWORD}}@db:5432/${POSTGRES_DB}
      JWT_SECRET_KEY: migrations-do-not-use-tokens
    volumes:
      - ./backend:/app:ro
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  # Production serves a static build (frontend/dist) from Caddy. Rebuild after
  # frontend changes:  docker compose run --rm frontend-build
  frontend-build:
    image: node:22-alpine
    profiles: ["build"]

    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build"]

  # Vite development server: development only, never behind the public site. It is not
  # started by default (profile "dev") and Caddy no longer proxies to it.
  frontend:
    image: node:22-alpine
    profiles: ["dev"]

    working_dir: /app

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

    depends_on:
      - backend

  turn:
    image: coturn/coturn:4.6.3
    profiles: ["calls"]
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    volumes:
      - ./secrets/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

  # Public entry point: Cloudflare Tunnel (outbound only, no open ports). The tunnel's
  # public hostname chat.slaxz.com points to http://caddy:8081 (set in the Cloudflare
  # dashboard). Token: secrets/cloudflared-token (0600). See ops/PUBLIC.md.
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    profiles: ["tunnel"]
    restart: unless-stopped
    # Same owner as the token file (0600), so it can be read without widening permissions.
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./secrets/cloudflared-token:/run/cloudflared/token:ro
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/cloudflared/token"]
    networks:
      tunnel:
        # Caddy trusts Cf-Connecting-Ip only from this address (Caddyfile, servers :8081).
        ipv4_address: 172.31.255.2
    depends_on:
      - caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped

    # :80 (tailnet) is published on loopback for tailscale serve; :8081 (public) is not
    # published at all and is reachable only from cloudflared on the tunnel network.
    ports:
      - "127.0.0.1:8080:80"

    networks:
      default: {}
      tunnel:
        # Fixed too, so Docker never hands cloudflared's address (.2) to Caddy.
        ipv4_address: 172.31.255.3

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      # Official website (slaxz.com), published by website/scripts/deploy.sh. Outside /srv,
      # which is read-only. Website deploys switch a symlink here; Caddy needs no restart.
      - ./website/.deploy:/srv-website:ro

    depends_on:
      - backend

networks:
  # Only Caddy and cloudflared: the tunnel can't reach the backend or the database.
  tunnel:
    ipam:
      config:
        - subnet: 172.31.255.0/28

volumes:
  postgres_data:
  frontend_node_modules:
  avatar_data:
