[package]
name = "messenger-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Windows desktop client for Realtime Messenger"
license = "MIT"
publish = false
build = "build.rs"

[[bin]]
name = "messenger"
path = "src/main.rs"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = [
    "wgpu", "tiny-skia", "crisp", "thread-pool", "x11", "wayland",
    "tokio", "image", "svg", "advanced", "lazy",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls", "json", "multipart", "stream", "form", "query", "http2", "charset",
] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
directories = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
open = "5"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
ed25519-dalek = "3"
sha2 = "0.10"
semver = "1"
base64 = "0.22"
arboard = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_UI_Shell",
] }
notify-rust = { version = "4.19", default-features = false }

[target.'cfg(not(windows))'.dependencies]
notify-rust = { version = "4.19" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
