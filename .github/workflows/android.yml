name: Android APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['android-v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and lint in the verified Android environment
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/android:/workspace" -w /workspace gradle:8.11.1-jdk17 bash -c '
            set -e
            export ANDROID_HOME=/tmp/android-sdk
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/tools.zip
            unzip -q /tmp/tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" >/dev/null
            gradle --no-daemon :app:assembleDebug :app:lintDebug
          '
      - uses: actions/upload-artifact@v4
        with:
          name: messenger-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: messenger-android-debug
      - name: Publish test APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv app-debug.apk messenger-android.apk
          sha256sum messenger-android.apk > messenger-android.apk.sha256
          cat > release-notes.md <<EOF
          Download and open [messenger-android.apk](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/messenger-android.apk) on your Android phone. No ZIP extraction needed. Do not download the Source code archives.

          Blue Messenger header, English Android interface, and a separate server settings button. Mobile chat navigation is delivered by the Messenger server.

          Android 8.0+. Enable Tailscale to connect to the Messenger server. This is a test APK with debug signing; if Android reports a signature conflict, uninstall the previous app and install this APK, then sign in again. Chats remain on the server.
          EOF
          gh release create "$RELEASE_TAG" messenger-android.apk messenger-android.apk.sha256 --prerelease --title "Messenger Android ${RELEASE_TAG#android-v}" --notes-file release-notes.md
          echo "### Download Messenger for Android" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download messenger-android.apk directly](https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/messenger-android.apk) — open this APK on your phone; no ZIP extraction needed." >> "$GITHUB_STEP_SUMMARY"
